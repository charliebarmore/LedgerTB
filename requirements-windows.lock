# Exact dependency versions for the Windows build.
#
# WHY THIS FILE EXISTS
# requirements.txt gives ranges ("streamlit>=1.59.0"), so a fresh CI install
# picks whatever is newest that day. That is how build 31013372986 shipped a
# ProBooks that returned HTTP 500 on every page: it drew starlette 1.4.0, which
# made an argument required that Streamlit 1.61.0 did not pass. Streamlit
# 1.61.1 later capped it at "starlette<1.4.0". Same source, different day,
# different app.
#
# This file closes the period. A tagged release can be rebuilt to the same
# bytes, and "what is in the build members are running" has an answer.
#
# VERIFIED on Windows 11 / Python 3.12.10, 2026-08-05:
#   - the full non-performance suite passes (pytest -m "not performance")
#   - the server starts and returns HTTP 200
#
# TO REGENERATE (on Windows, Python 3.12, after changing requirements.txt):
#   python -m venv .lockenv
#   .lockenv\Scripts\python -m pip install -r requirements.txt -r requirements-desktop.txt
#   .lockenv\Scripts\python -m pip freeze > requirements-windows.lock
# Then re-run the tests and the server smoke check before committing.
#
# macOS still builds from requirements.txt. Give it its own lock when the Mac
# release is automated.

