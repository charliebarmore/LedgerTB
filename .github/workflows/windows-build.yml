name: Windows build spike

# Answers the questions a Windows release depends on, in one run:
#   1. Does the pinned dependency set install and give encryption at rest?
#   2. Does the test suite pass on Windows?
#   3. Does PyInstaller produce a runnable LedgerTB.exe (frozen selfcheck)?
#   4. Does the built app actually SERVE A PAGE? (selfcheck alone missed a
#      starlette break that 500'd every request)
#   5. Does the Inno Setup installer build?
# Steps continue on error so a single failure still yields the other signals.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and validate Windows package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Install dependencies (pinned)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.lock

      - name: "Signal 1: encryption at rest"
        id: sqlcipher
        continue-on-error: true
        shell: pwsh
        run: |
          pip check
          python -c "import starlette, streamlit; print('starlette', starlette.__version__, '| streamlit', streamlit.__version__)"
          python -c "from database import connection; assert connection.ENCRYPTION_AVAILABLE, 'driver imported but encryption unavailable'; print('SQLCIPHER OK - encrypted at rest works on Windows')"

      - name: "Signal 2: test suite"
        id: tests
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: python -m pytest -q -m "not performance" -o faulthandler_timeout=120

      - name: "Signal 3: PyInstaller build"
        id: build
        continue-on-error: true
        shell: pwsh
        run: pyinstaller LedgerTB.spec --noconfirm

      - name: "Signal 3b: frozen selfcheck"
        id: selfcheck
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        # The exe is a GUI-subsystem binary: "&" would not wait for it and its
        # stdout is detached, so run via Start-Process and trust the exit code.
        run: |
          $env:LEDGERTB_MODE = "selfcheck"
          $p = Start-Process -FilePath dist/LedgerTB/LedgerTB.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: "Signal 4: the built app serves a page"
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        # selfcheck imports modules; this starts the server and fetches a page
        # with gzip requested. Build 31013372986 passed selfcheck and returned
        # HTTP 500 on every request.
        run: pwsh scripts/smoke_serve.ps1 -ExePath dist/LedgerTB/LedgerTB.exe

      - name: "Signal 5: closing the window stops the app"
        id: close
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: pwsh scripts/smoke_close.ps1 -ExePath dist/LedgerTB/LedgerTB.exe

      - name: Read app version
        id: ver
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $v = python -c "from version import APP_VERSION; print(APP_VERSION)"
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: "Signal 6: Inno Setup installer"
        id: installer
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          APP_VERSION: ${{ steps.ver.outputs.value }}
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # chocolatey and winget put ISCC in different places, so find it
          # rather than hardcode one path.
          $roots = @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "$env:LOCALAPPDATA\Programs")
          $iscc = $roots | Where-Object { $_ } | ForEach-Object {
              Get-ChildItem -Path $_ -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue
          } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found after installing Inno Setup"; exit 1 }
          Write-Host "using $iscc"
          & $iscc "/DAppVersion=$env:APP_VERSION" scripts\ledgertb.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      - name: Upload installer
        id: upload_installer
        if: steps.installer.outcome == 'success'
        # Uploads are a convenience, not a signal: the free plan's artifact
        # quota can block them (recalculated slowly after deletions), and
        # that must not mask seven green signals or skip the scorecard.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LedgerTB-windows-installer
          path: installer/*.exe
          retention-days: 3

      - name: Upload Windows bundle
        id: upload_bundle
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LedgerTB-windows
          path: dist/LedgerTB/
          retention-days: 3
          # .streamlit/ is dot-prefixed; without this the artifact silently
          # ships without the theme/product-chrome config (found the hard way).
          include-hidden-files: true

      - name: Scorecard
        if: always()
        env:
          SQLCIPHER_OUTCOME: ${{ steps.sqlcipher.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SELFCHECK_OUTCOME: ${{ steps.selfcheck.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          CLOSE_OUTCOME: ${{ steps.close.outcome }}
          INSTALLER_OUTCOME: ${{ steps.installer.outcome }}
          UPLOAD_INSTALLER_OUTCOME: ${{ steps.upload_installer.outcome }}
          UPLOAD_BUNDLE_OUTCOME: ${{ steps.upload_bundle.outcome }}
        shell: pwsh
        # continue-on-error above exists to gather ALL signals in one run —
        # but the JOB must still go red if any signal failed. A green run
        # with a failure buried in an annotation is how 34 test failures
        # shipped unnoticed. Upload outcomes are REPORTED, never gated:
        # a quota-blocked artifact is an inconvenience, not a broken build.
        run: |
          Write-Host "deps + encryption: $env:SQLCIPHER_OUTCOME"
          Write-Host "test suite:        $env:TESTS_OUTCOME"
          Write-Host "pyinstaller:       $env:BUILD_OUTCOME"
          Write-Host "selfcheck:         $env:SELFCHECK_OUTCOME"
          Write-Host "serves a page:     $env:SMOKE_OUTCOME"
          Write-Host "window shutdown:   $env:CLOSE_OUTCOME"
          Write-Host "installer:         $env:INSTALLER_OUTCOME"
          Write-Host "artifact uploads:  installer=$env:UPLOAD_INSTALLER_OUTCOME bundle=$env:UPLOAD_BUNDLE_OUTCOME (informational)"
          if ($env:UPLOAD_INSTALLER_OUTCOME -eq "failure" -or $env:UPLOAD_BUNDLE_OUTCOME -eq "failure") {
            Write-Warning "artifact upload failed (storage quota?) - build validated but no downloadable artifact on this run"
          }
          $bad = @($env:SQLCIPHER_OUTCOME, $env:TESTS_OUTCOME,
                   $env:BUILD_OUTCOME, $env:SELFCHECK_OUTCOME,
                   $env:SMOKE_OUTCOME, $env:CLOSE_OUTCOME,
                   $env:INSTALLER_OUTCOME) |
                 Where-Object { $_ -eq "failure" }
          if ($bad) { Write-Error "one or more signals failed"; exit 1 }
