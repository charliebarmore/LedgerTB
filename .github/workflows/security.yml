name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned security tools
        run: | # pragma: allowlist secret -- scanner installs itself here
          python -m pip install --disable-pip-version-check \
            pip-audit==2.10.1 \
            zizmor==1.29.0
          python -m pip install --disable-pip-version-check detect-secrets==1.5.0  # pragma: allowlist secret

      - name: Reject secrets in tracked files
        shell: bash
        run: |
          mapfile -d '' tracked_files < <(git ls-files -z)
          detect-secrets-hook -- "${tracked_files[@]}"

      - name: Audit release dependencies
        run: |
          pip-audit --no-deps --disable-pip -r requirements-windows.lock
          pip-audit --no-deps --disable-pip -r requirements-macos-arm64.lock

      - name: Audit GitHub Actions workflows
        run: zizmor --pedantic --offline .github/workflows
