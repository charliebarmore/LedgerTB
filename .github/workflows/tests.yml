# Functional signal on every proposed contribution: the full non-performance
# suite on the same open-range install a source user gets. The PR result is the
# merge gate, so merging that already-tested commit does not spend the same
# Actions minutes a second time. Direct-to-main changes can still use the
# manual dispatch while branch protection keeps the normal path honest.
name: Tests

# The landing page, brand assets, and docs ship in this repo so their claims
# stay next to the code they describe — but no test reads those directories,
# so editing them should not run the suite. Root Markdown deliberately still
# does: tests/test_streamlit_config.py reads README.md to check the documented
# run command still pins the server to loopback.
on:
  pull_request:
    paths-ignore: ['site/**', 'branding/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install SQLCipher headers
        # Keep headers available if the selected Python/platform has no wheel.
        # Encryption is still required by the tests and release selfcheck.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -ra -m "not performance" --junitxml=test-results/pytest.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: test-results/
          retention-days: 14

  linux-pilot:
    name: Linux pinned Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-linux.lock
      - name: Install pinned Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev
          python -m pip install -r requirements-linux.lock
          python -m pip check
          python scripts/verify_lock.py requirements-linux.lock
      - name: Test the pinned source pilot
        run: python -m pytest -q -ra -m "not performance" --junitxml=test-results/linux.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-pinned-${{ matrix.python }}
          path: test-results/
          retention-days: 14

  linux-native:
    name: Linux GTK window
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the system GTK stack and pinned application
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libsqlcipher-dev xvfb dbus-x11
          /usr/bin/python3 -m venv --system-site-packages .linux-venv
          .linux-venv/bin/python -m pip install -r requirements-linux.lock
          .linux-venv/bin/python -m pip check
          .linux-venv/bin/python scripts/verify_lock.py requirements-linux.lock
      - name: Unlock an encrypted book in GTK and close the real launcher
        run: timeout 150 xvfb-run -a dbus-run-session -- .linux-venv/bin/python scripts/smoke_linux.py

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev
          python -m pip install -r requirements-dev.txt
          npm ci --prefix tests/browser-tools --no-audit --no-fund
          tests/browser-tools/node_modules/.bin/agent-browser install --with-deps
      - name: Exercise the real browser and verify durable postings
        run: |
          python scripts/check_browser_fixture.py \
            --agent-browser "$PWD/tests/browser-tools/node_modules/.bin/agent-browser" \
            --output test-results/browser
          python scripts/check_review_browser.py \
            --agent-browser "$PWD/tests/browser-tools/node_modules/.bin/agent-browser" \
            --output test-results/browser/review
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-acceptance
          path: test-results/browser/
          retention-days: 14
