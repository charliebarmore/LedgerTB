# Functional signal on every proposed contribution: the full non-performance
# suite on the same open-range install a source user gets. The PR result is the
# merge gate, so merging that already-tested commit does not spend the same
# Actions minutes a second time. Direct-to-main changes can still use the
# manual dispatch while branch protection keeps the normal path honest.
name: Tests

# The landing page, brand assets, and docs ship in this repo so their claims
# stay next to the code they describe — but no test reads those directories,
# so editing them should not run the suite. Root Markdown deliberately still
# does: tests/test_streamlit_config.py reads README.md to check the documented
# run command still pins the server to loopback.
on:
  pull_request:
    paths-ignore: ['site/**', 'branding/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install SQLCipher headers
        # sqlcipher3 has no Linux wheel, so it builds from source here; without
        # the library the app would fall back to an unencrypted database and
        # the encryption tests would not be exercised.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -m "not performance"
