name: Release

# Tag-triggered release build. Unlike the spike workflow, nothing here
# continues on error: a release either passes every gate or is not published.
#   git tag v0.1.0 && git push origin v0.1.0
# Publishes a DRAFT release for review before it goes live.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and verify Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $appVersion = python -c "from version import APP_VERSION; print(APP_VERSION)"
          $tagVersion = $env:RELEASE_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $appVersion) {
            Write-Error "Release tag $env:RELEASE_REF_NAME does not match APP_VERSION $appVersion"
            exit 1
          }

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies (pinned)
        shell: pwsh
        # Install exact versions, not ranges. Build 31013372986 drew starlette
        # 1.4.0 from an open range and shipped an app that returned HTTP 500 on
        # every page. A release must be rebuildable to the same bytes.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.lock

      - name: Verify the pinned set is actually installed
        shell: pwsh
        # A silent resolver downgrade would put us back where we started.
        run: |
          pip check
          python -c "import starlette, streamlit; print('starlette', starlette.__version__, '| streamlit', streamlit.__version__)"

      - name: Refuse to ship without encryption
        shell: pwsh
        run: python -c "from database import connection; assert connection.ENCRYPTION_AVAILABLE, 'sqlcipher missing - refusing to ship an unencrypted build'"

      - name: Tests
        shell: pwsh
        run: python -m pytest -q -m "not performance"

      - name: Build
        shell: pwsh
        run: pyinstaller ProBooks.spec --noconfirm

      - name: Frozen selfcheck
        shell: pwsh
        run: |
          $env:PROBOOKS_MODE = "selfcheck"
          $p = Start-Process -FilePath dist/ProBooks/ProBooks.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Smoke test — the built app must serve a page
        shell: pwsh
        # selfcheck proves the parts are in the box; this proves the machine
        # runs. The starlette 1.4.0 breakage passed selfcheck and 500'd on
        # every request.
        run: pwsh scripts/smoke_serve.ps1 -ExePath dist/ProBooks/ProBooks.exe

      - name: Bundle sanity
        shell: pwsh
        # The config folder is dot-prefixed and has been lost in transit
        # before; a release without it ships the wrong UI.
        run: |
          if (-not (Test-Path "dist/ProBooks/_internal/.streamlit/config.toml")) {
            Write-Error "bundle is missing .streamlit/config.toml"
            exit 1
          }

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from version import APP_VERSION; print(APP_VERSION)"
          Write-Host "app version: $v"
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        env:
          APP_VERSION: ${{ steps.ver.outputs.value }}
        shell: pwsh
        # The installer is the supported download. A zip extracted by Explorer
        # carries mark-of-the-web on every file, which stops .NET loading the
        # bundled Python.Runtime.dll and kills the app before its window opens.
        run: |
          # chocolatey and winget put ISCC in different places, so find it
          # rather than hardcode one path.
          $roots = @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "$env:LOCALAPPDATA\Programs")
          $iscc = $roots | Where-Object { $_ } | ForEach-Object {
              Get-ChildItem -Path $_ -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue
          } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found after installing Inno Setup"; exit 1 }
          Write-Host "using $iscc"
          & $iscc "/DAppVersion=$env:APP_VERSION" scripts\probooks.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      - name: Name the installer assets
        env:
          APP_VERSION: ${{ steps.ver.outputs.value }}
        shell: pwsh
        # Two names for the same bytes: the versioned file for the archive, and
        # a stable name so releases/latest/download/ProBooks-windows-x64-setup.exe
        # is an evergreen link that always serves the newest release.
        run: |
          $src = "installer\ProBooks-$env:APP_VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $src)) { Write-Error "installer not found at $src"; exit 1 }
          Copy-Item $src "ProBooks-$env:APP_VERSION-windows-x64-setup.exe"
          Copy-Item $src "ProBooks-windows-x64-setup.exe"

      - name: Package the zip (secondary)
        env:
          APP_VERSION: ${{ steps.ver.outputs.value }}
        shell: pwsh
        # Kept for anyone deploying without an installer. NOTE: files extracted
        # from this zip by Explorer carry mark-of-the-web and the app will not
        # start until they are unblocked — see the README. The installer is the
        # supported path.
        run: |
          Compress-Archive -Path dist/ProBooks/* -DestinationPath "ProBooks-$env:APP_VERSION-windows-x64.zip"
          Copy-Item "ProBooks-$env:APP_VERSION-windows-x64.zip" ProBooks-windows-x64.zip

      # Pass only the finished release files to a separate least-privilege job.
      # The long-running build and all of its dependencies keep read-only access
      # to repository contents; only the tiny publication job receives write.
      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: probooks-release-assets-${{ github.run_id }}
          path: |
            ProBooks-${{ steps.ver.outputs.value }}-windows-x64-setup.exe
            ProBooks-windows-x64-setup.exe
            ProBooks-${{ steps.ver.outputs.value }}-windows-x64.zip
            ProBooks-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create the draft release and upload assets.
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: probooks-release-assets-${{ github.run_id }}
          path: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft \
            --generate-notes \
            --verify-tag
