name: Bug report
description: Report a reproducible problem in LedgerTB
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include real client data, book files, bank statements, credentials, API keys, tax identifiers, or unredacted logs. Report security vulnerabilities privately through the Security Policy.
  - type: input
    id: version
    attributes:
      label: LedgerTB version or commit
      description: Use the release version or commit SHA when available.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS Apple Silicon
        - macOS Intel
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Windows installer
        - Windows ZIP
        - macOS local build
        - Running from source
        - Other
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: What happened?
      description: Describe the problem and any visible error using sanitized information.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional sanitized context
      description: Add redacted logs, screenshots, or a minimal synthetic-data example if useful.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed all client, personal, financial, and credential data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
